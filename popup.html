<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <h3 class="title">Zendesk View Manager</h3>
    </div>
    
    <hr class="divider">

    <div class="control-stack">
      <button id="toggle-edit" class="btn btn-primary">
        Enable Edit Mode
      </button>
      
      <button id="toggle-hidden-list" class="btn btn-secondary">
        <span>Hidden Views</span>
        <span id="hidden-count-tag" class="count-tag">0</span>
      </button>

      <div id="hidden-list-panel" class="hidden-list-panel">
        <div id="hidden-items-container"></div>
      </div>

      <button id="btn-reset" class="btn btn-danger">
        Reset to Default
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
